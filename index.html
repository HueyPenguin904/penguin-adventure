<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Adventure 🐧</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        #game-container {
            text-align: center;
        }
        h1 {
            color: #a8dadc;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .controls {
            color: #f1faee;
            margin-top: 10px;
            font-size: 0.9em;
        }
        canvas {
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(168, 218, 220, 0.3);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🐧 Penguin Adventure 🐧</h1>
        <script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs" type="module"></script>
        <script src="game.js" type="module"></script>
        <p class="controls">⬅️➡️ Move | SPACE Jump | Collect da fish! 🐟</p>
    </div>
</body>
</html>
